apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-qwen
  namespace: inference
spec:
  scaleTargetRef:
    name: vllm-qwen
  minReplicaCount: 1
  maxReplicaCount: 2
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring:80
        query: sum(vllm:num_requests_waiting{namespace="inference"})
        threshold: "5"      # more than 5 queued requests per pod: add a pod
